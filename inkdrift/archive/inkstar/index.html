<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Inkstar — Procedural Cartoon Space Tech Demo</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #090b14;
    --panel: rgba(11, 15, 29, 0.86);
    --line: rgba(226, 238, 255, 0.18);
    --text: #edf5ff;
    --muted: #9eb1c7;
    --accent: #65f0bf;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #070914;
    font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  canvas {
    width: 100vw; height: 100vh; display: block;
    touch-action: none;
    cursor: crosshair;
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    pointer-events: none;
    background: radial-gradient(circle at 50% 45%, #19213f, #080a15 60%);
    color: #eef6ff; letter-spacing: .12em; font-weight: 850; text-transform: uppercase;
    transition: opacity .5s ease;
  }
  #boot.hidden { opacity: 0; }
  #boot small { display:block; margin-top: 10px; color:#8ba0b8; text-align:center; font-size:11px; letter-spacing:.18em; }
</style>
</head>
<body>
<canvas id="game" aria-label="Procedural cartoon space game tech demo"></canvas>
<div id="boot">Inkstar<small>procedural illustration engine</small></div>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Canvas + sizing
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  const boot = document.getElementById('boot');
  let W = innerWidth, H = innerHeight, DPR = 1;
  let coarsePointer = matchMedia('(pointer: coarse)').matches;

  function resize() {
    W = innerWidth; H = innerHeight;
    DPR = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildNebulaTexture();
  }
  addEventListener('resize', resize, { passive: true });

  // ---------------------------------------------------------------------------
  // Math, deterministic random, palettes
  // ---------------------------------------------------------------------------
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, speed, dt) => lerp(a, b, 1 - Math.exp(-speed * dt));
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
  const dist2 = (ax, ay, bx, by) => (ax-bx)*(ax-bx) + (ay-by)*(ay-by);
  const shortestAngle = (a, b) => Math.atan2(Math.sin(b-a), Math.cos(b-a));

  function hash32(n) {
    n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
    n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
    return (n ^ (n >>> 16)) >>> 0;
  }
  function hash2(x, y, seed = 0) {
    return hash32(Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263) ^ seed);
  }
  class RNG {
    constructor(seed) { this.s = (seed >>> 0) || 0x9e3779b9; }
    next() {
      let x = this.s;
      x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
      this.s = x >>> 0;
      return this.s / 4294967296;
    }
    range(a,b){ return lerp(a,b,this.next()); }
    int(a,b){ return Math.floor(this.range(a,b+1)); }
    pick(arr){ return arr[Math.floor(this.next()*arr.length)]; }
    chance(p){ return this.next() < p; }
  }

  function hexToRgb(hex) {
    const m = hex.replace('#','');
    const n = parseInt(m.length===3 ? m.split('').map(c=>c+c).join('') : m,16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }
  function mixColor(a,b,t,alpha=1) {
    const A=hexToRgb(a), B=hexToRgb(b);
    return `rgba(${Math.round(lerp(A.r,B.r,t))},${Math.round(lerp(A.g,B.g,t))},${Math.round(lerp(A.b,B.b,t))},${alpha})`;
  }
  function rgba(hex, a=1) {
    const c=hexToRgb(hex); return `rgba(${c.r},${c.g},${c.b},${a})`;
  }

  // ---------------------------------------------------------------------------
  // UI helpers
  // ---------------------------------------------------------------------------
  function rr(x,y,w,h,r=12) {
    const p = new Path2D();
    p.roundRect(x,y,w,h,Math.min(r,w/2,h/2));
    return p;
  }
  function panel(x,y,w,h,r=16, alpha=.88) {
    ctx.save();
    ctx.fillStyle = `rgba(8,12,25,${alpha})`;
    ctx.fill(rr(x,y,w,h,r));
    const g = ctx.createLinearGradient(x,y,x+w,y+h);
    g.addColorStop(0,'rgba(218,239,255,.24)');
    g.addColorStop(.5,'rgba(111,139,176,.08)');
    g.addColorStop(1,'rgba(218,239,255,.17)');
    ctx.strokeStyle = g; ctx.lineWidth=1.4;
    ctx.stroke(rr(x+.7,y+.7,w-1.4,h-1.4,r));
    ctx.restore();
  }
  function text(str,x,y,size=14,weight=600,color='#edf5ff',align='left') {
    ctx.save();
    ctx.font = `${weight} ${size}px Inter, ui-rounded, system-ui, sans-serif`;
    ctx.textAlign=align; ctx.textBaseline='alphabetic';
    ctx.fillStyle=color; ctx.fillText(str,x,y);
    ctx.restore();
  }
  function wrapText(str,x,y,maxWidth,lineHeight=19,size=14,weight=560,color='#b8c8da',maxLines=3) {
    ctx.save();ctx.font=`${weight} ${size}px Inter, ui-rounded, system-ui, sans-serif`;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle=color;
    const words=String(str).split(/\s+/);let line='',lines=[];
    for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word;}else line=test;}
    if(line)lines.push(line);
    lines=lines.slice(0,maxLines);
    lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));ctx.restore();
    return lines.length;
  }

  function label(str,x,y,size=10,color='#9eb1c7',align='left') {
    ctx.save();
    ctx.font = `800 ${size}px Inter, ui-rounded, system-ui, sans-serif`;
    ctx.textAlign=align; ctx.textBaseline='alphabetic';
    ctx.letterSpacing='1px';
    ctx.fillStyle=color; ctx.fillText(str.toUpperCase(),x,y);
    ctx.restore();
  }
  function line(x1,y1,x2,y2,color='rgba(255,255,255,.2)',width=1) {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.stroke();
  }
  function drawPill(x,y,w,h,caption,active=false,color='#65f0bf') {
    ctx.save();
    ctx.fillStyle = active ? rgba(color,.16) : 'rgba(255,255,255,.035)';
    ctx.strokeStyle = active ? rgba(color,.7) : 'rgba(224,237,255,.14)';
    ctx.lineWidth = 1.2;
    ctx.fill(rr(x,y,w,h,h/2)); ctx.stroke(rr(x+.6,y+.6,w-1.2,h-1.2,h/2));
    text(caption,x+w/2,y+h/2+4,11,800,active?color:'#bed0e2','center');
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Audio: intentionally tiny, generated at runtime
  // ---------------------------------------------------------------------------
  let audio = null;
  function ensureAudio() {
    if (audio) { if (audio.ac.state==='suspended') audio.ac.resume(); return; }
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const master = ac.createGain(); master.gain.value = .18; master.connect(ac.destination);
      const osc = ac.createOscillator(); osc.type='sawtooth'; osc.frequency.value=48;
      const filter = ac.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=150;
      const gain = ac.createGain(); gain.gain.value=0;
      osc.connect(filter); filter.connect(gain); gain.connect(master); osc.start();
      audio={ac,master,osc,filter,gain};
    } catch (_) {}
  }
  function updateAudio(thrust, boost) {
    if (!audio) return;
    const t=audio.ac.currentTime;
    audio.gain.gain.setTargetAtTime((thrust*.08 + boost*.075),t,.045);
    audio.osc.frequency.setTargetAtTime(48 + thrust*38 + boost*55,t,.05);
    audio.filter.frequency.setTargetAtTime(130 + thrust*430 + boost*650,t,.05);
  }
  function uiChime(up=true) {
    if (!audio) return;
    const {ac,master}=audio, o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(up?430:330,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(up?720:220,ac.currentTime+.17);

  function impactSound() {

  // ---------------------------------------------------------------------------
  // Background nebula + deterministic stars
  // ---------------------------------------------------------------------------
  let nebulaCanvas = null;
  function buildNebulaTexture() {
    const scale=.55;
    nebulaCanvas=document.createElement('canvas');
    nebulaCanvas.width=Math.max(420,Math.floor(W*scale));
    nebulaCanvas.height=Math.max(260,Math.floor(H*scale));
    const n=nebulaCanvas.getContext('2d');
    const nw=nebulaCanvas.width, nh=nebulaCanvas.height;
    const bg=n.createLinearGradient(0,0,nw,nh);
    bg.addColorStop(0,'#080a18'); bg.addColorStop(.48,'#12102a'); bg.addColorStop(1,'#071622');
    n.fillStyle=bg; n.fillRect(0,0,nw,nh);
    const seed=systemSeed || 18192;
    const rng=new RNG(seed^0xa44a1);
    n.save(); n.globalCompositeOperation='screen'; n.filter='blur(28px)';
    const colors=['#5d2c96','#246d8c','#265b52','#8f3e77','#2f4e9b'];
    for(let i=0;i<20;i++) {
      const x=rng.range(-.1*nw,1.1*nw), y=rng.range(-.1*nh,1.1*nh), r=rng.range(.1,.33)*Math.min(nw,nh);
      const g=n.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,rgba(rng.pick(colors),rng.range(.09,.22)));
      g.addColorStop(.42,rgba(rng.pick(colors),rng.range(.025,.11)));
      g.addColorStop(1,'rgba(0,0,0,0)');
      n.fillStyle=g; n.beginPath(); n.arc(x,y,r,0,TAU); n.fill();
    }
    n.restore();
    // Fine granular cloud mottling, subtle enough not to become procedural mush.
    const img=n.getImageData(0,0,nw,nh), data=img.data;
    for(let i=0;i<data.length;i+=4){
      const grain=(Math.random()-.5)*5;
      data[i]=clamp(data[i]+grain,0,255); data[i+1]=clamp(data[i+1]+grain,0,255); data[i+2]=clamp(data[i+2]+grain,0,255);
    }
    n.putImageData(img,0,0);
  }

  function drawBackground(time) {
    ctx.fillStyle='#070914'; ctx.fillRect(0,0,W,H);
    if(nebulaCanvas) {
      const px=((player.x*.007)%W+W)%W, py=((player.y*.005)%H+H)%H;
      ctx.save(); ctx.globalAlpha=.96;
      ctx.drawImage(nebulaCanvas,-px*.06,-py*.06,W*1.08,H*1.08);
      ctx.restore();
    }

    // Infinite deterministic tiled starfield with three parallax strata.
    const tile=260;
    for(let layer=0;layer<3;layer++) {
      const par=[.035,.09,.18][layer];
      const density=[12,9,6][layer];
      const ox=player.x*par, oy=player.y*par;
      const minTx=Math.floor((ox-W/2)/tile)-1, maxTx=Math.floor((ox+W/2)/tile)+1;
      const minTy=Math.floor((oy-H/2)/tile)-1, maxTy=Math.floor((oy+H/2)/tile)+1;
      for(let ty=minTy;ty<=maxTy;ty++) for(let tx=minTx;tx<=maxTx;tx++) {
        const rng=new RNG(hash2(tx,ty,systemSeed+layer*1009));
        for(let i=0;i<density;i++) {
          const wx=tx*tile+rng.next()*tile, wy=ty*tile+rng.next()*tile;
          const sx=wx-ox+W/2, sy=wy-oy+H/2;
          const tw=.65+.35*Math.sin(time*rng.range(.5,1.8)+rng.range(0,TAU));
          const r=lerp(.45,1.65,layer/2)*rng.range(.55,1.25);
          const c=layer===2 && rng.chance(.25) ? rng.pick(['#8be8ff','#ffd98e','#d5adff']) : '#e8f3ff';
          ctx.globalAlpha=lerp(.22,.78,layer/2)*tw;
          ctx.fillStyle=c; ctx.beginPath(); ctx.arc(sx,sy,r,0,TAU); ctx.fill();
          if(layer===2 && r>1.2 && rng.chance(.12)) {
            ctx.globalAlpha=.14*tw; ctx.strokeStyle=c; ctx.lineWidth=.7;
            ctx.beginPath(); ctx.moveTo(sx-5,sy);ctx.lineTo(sx+5,sy);ctx.moveTo(sx,sy-5);ctx.lineTo(sx,sy+5);ctx.stroke();
          }
        }
      }
    }
    ctx.globalAlpha=1;

    // Slow atmospheric dust gives the empty space a little motion without noise.
    ctx.save(); ctx.globalAlpha=.12;
    for(let i=0;i<28;i++) {
      const sx=((i*173.2 + time*(3+i%5) - player.x*.02)%(W+100)+W+100)%(W+100)-50;
      const sy=((i*i*27.7 + time*(1+i%3) - player.y*.014)%(H+100)+H+100)%(H+100)-50;
      ctx.fillStyle=i%4===0?'#78ddce':'#c5b4e6';
      ctx.beginPath();ctx.arc(sx,sy,.7+(i%3)*.35,0,TAU);ctx.fill();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Procedural ship: meaningful parts, stable geometry, motion-aware rig
  // ---------------------------------------------------------------------------
  function buildShip(seed) {
    const rng=new RNG(seed^0x9137);
    const p=rng.pick(palettes);
    // Squatter proportions and deliberate imbalance produce a more characterful craft.
    const w=rng.range(54,68), h=rng.range(66,82);
    const asym=rng.range(-.38,.38);
    const oddSide=rng.chance(.5)?-1:1;
    const podStyle=rng.int(0,2);
    const cockpitStyle=rng.int(0,2);
    const antennaCount=rng.int(1,3);
    const panelCount=rng.int(2,4);
    const noseX=asym*w*.18;
    const hull=new Path2D();
    hull.moveTo(noseX,-h*.56);
    hull.bezierCurveTo(w*(.27+asym*.04),-h*.49,w*(.54+asym*.05),-h*.17,w*(.47+asym*.06),h*.12);
    hull.bezierCurveTo(w*.42,h*.39,w*(.22+asym*.04),h*.55,asym*w*.04,h*.57);
    hull.bezierCurveTo(-w*(.30-asym*.04),h*.53,-w*(.50-asym*.05),h*.31,-w*(.43-asym*.04),h*.02);
    hull.bezierCurveTo(-w*(.39-asym*.03),-h*.25,-w*(.21-asym*.05),-h*.49,noseX,-h*.56);
    hull.closePath();
    const shadow=new Path2D();
    shadow.moveTo(-w*.50,-h*.01);
    shadow.bezierCurveTo(-w*.06,h*.07,w*.32,-h*.06,w*.50,h*.17);
    shadow.lineTo(w*.38,h*.60); shadow.lineTo(-w*.39,h*.60); shadow.closePath();
    const highlight=new Path2D();
    highlight.moveTo(-w*.23+asym*5,-h*.35); highlight.bezierCurveTo(-w*.12,-h*.48,w*.06,-h*.48,w*.18,-h*.38);
    highlight.bezierCurveTo(w*.02,-h*.33,-w*.1,-h*.23,-w*.23,-h*.10); highlight.closePath();
    const cockpit=new Path2D();
    const cx=asym*w*.24;
    if(cockpitStyle===0){
      cockpit.ellipse(cx,-h*.22,w*.25,h*.19,asym*.35,0,TAU);
    } else if(cockpitStyle===1) {
      cockpit.moveTo(-w*.23+cx,-h*.34); cockpit.quadraticCurveTo(cx,-h*.49,w*.24+cx,-h*.29);
      cockpit.quadraticCurveTo(w*.19+cx,-h*.04,-w*.18+cx,-h*.08); cockpit.closePath();
    } else {
      cockpit.roundRect(-w*.23+cx,-h*.39,w*.46,h*.30,11);
    }
    const basePod=rng.range(.84,1.12);
    return {
      seed,p,w,h,asym,oddSide,podStyle,cockpitStyle,antennaCount,panelCount,hull,shadow,highlight,cockpit,
      podLagL:0,podLagR:0,finLag:0,blink:0,
      decal:rng.pick(['chevron','dot','stripe']),
      podSize:basePod,
      podScaleL:basePod*(oddSide<0?rng.range(1.05,1.25):rng.range(.78,.98)),
      podScaleR:basePod*(oddSide>0?rng.range(1.05,1.25):rng.range(.78,.98)),
      sideModule:rng.int(0,2),
      finSize:rng.range(.8,1.25),
      antennaLean:Array.from({length:antennaCount},()=>rng.range(-.4,.4))
    };
  }

  function strokeFill(path, fill, stroke=INK, width=5) {
    ctx.fillStyle=fill; ctx.fill(path); ctx.strokeStyle=stroke; ctx.lineWidth=width;
    ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke(path);
  }

  function drawEnginePod(ship, side, thrust, boost, turn, time) {
    const {w,h,p,podStyle}=ship;
    const podSize=side<0?ship.podScaleL:ship.podScaleR;
    const s=side;
    const x=s*w*.42, y=h*.22;
    const lag=(side<0?ship.podLagL:ship.podLagR);
    ctx.save(); ctx.translate(x, y+lag*2.5); ctx.rotate(-s*turn*.07 + lag*.02); ctx.scale(podSize,podSize);
    // Mount shadow
    ctx.fillStyle='rgba(0,0,0,.32)'; ctx.beginPath();ctx.ellipse(-s*2,4,15,25,.05*s,0,TAU);ctx.fill();
    // Pod silhouette + cel planes
    const pod=new Path2D();
    if(podStyle===0){
      pod.moveTo(0,-25); pod.bezierCurveTo(s*10,-24,s*15,-10,s*13,10); pod.bezierCurveTo(s*11,27,-s*8,28,-s*11,9);pod.bezierCurveTo(-s*13,-11,-s*8,-24,0,-25);pod.closePath();
    } else if(podStyle===1){
      pod.roundRect(-12,-23,24,48,9);
    } else {
      pod.moveTo(-11,-22);pod.lineTo(10,-17);pod.lineTo(14,12);pod.lineTo(3,27);pod.lineTo(-12,17);pod.closePath();
    }

    ctx.save();ctx.clip(pod);ctx.fillStyle=p.shade;ctx.beginPath();ctx.ellipse(8*s,11,18,31,.2*s,0,TAU);ctx.fill();ctx.restore();
    ctx.fillStyle=p.hi;ctx.globalAlpha=.65;ctx.beginPath();ctx.ellipse(-5*s,-12,3.5,11,-.2*s,0,TAU);ctx.fill();ctx.globalAlpha=1;
    // Engine bell
    ctx.fillStyle=p.deep;ctx.strokeStyle=INK;ctx.lineWidth=4;
    ctx.beginPath();ctx.ellipse(0,24,10.5,6,0,0,TAU);ctx.fill();ctx.stroke();
    const glow=thrust*.8+boost;
    if(glow>.02){
      const g=ctx.createRadialGradient(0,25,1,0,25,15+glow*12);
      g.addColorStop(0,'rgba(220,255,255,.95)');g.addColorStop(.18,rgba(p.glass,.9));g.addColorStop(.55,rgba(p.glass,.25));g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,26,16+glow*8,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';
    }

    ctx.restore();
  }

  function drawShip(ship,x,y,angle,thrust,boost,turn,time,alpha=1) {
    const {w,h,p}=ship;
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.translate(x,y);
    ctx.rotate(angle);
    const squash=1+boost*.035;
    ctx.scale(1-turn*turn*.015,squash);

    // Local cast shadow subtly anchors the layered drawing.
    ctx.save();ctx.translate(5,8);ctx.globalAlpha=.25;ctx.filter='blur(5px)';ctx.fillStyle='#000';ctx.fill(ship.hull);ctx.restore();

    // Rear fins behind the body.
    const finMotion=ship.finLag;
    for(const side of [-1,1]){
      ctx.save();ctx.translate(side*w*.33,h*.22);ctx.rotate(side*(.20+finMotion*.06));
      const fin=new Path2D();fin.moveTo(0,-12);fin.lineTo(side*w*.35,h*.21*ship.finSize);fin.lineTo(side*w*.12,h*.29);fin.lineTo(-side*3,13);fin.closePath();
      strokeFill(fin,p.shade,INK,4.5);
      ctx.fillStyle=p.body;ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(side*w*.22,h*.13);ctx.lineTo(side*w*.08,h*.17);ctx.closePath();ctx.fill();
      ctx.restore();
    }

    drawEnginePod(ship,-1,thrust,boost,turn,time);
    drawEnginePod(ship, 1,thrust,boost,turn,time);

    // Crooked utility arm and coolant loop: semantic asymmetry rather than noise.
    {
      const s=ship.oddSide;
      ctx.save();
      ctx.strokeStyle=INK;ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(s*w*.20,-h*.05);ctx.quadraticCurveTo(s*w*.58,-h*.13,s*w*.66,h*.02);ctx.quadraticCurveTo(s*w*.78,h*.18,s*w*.57,h*.27);ctx.stroke();
      ctx.strokeStyle=ship.sideModule===0?p.accent:ship.sideModule===1?p.glass:p.hi;ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(s*w*.20,-h*.05);ctx.quadraticCurveTo(s*w*.58,-h*.13,s*w*.66,h*.02);ctx.quadraticCurveTo(s*w*.78,h*.18,s*w*.57,h*.27);ctx.stroke();
      ctx.translate(s*w*.68,h*.02);ctx.rotate(s*.25+turn*.06);
      ctx.fillStyle=p.deep;ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,0,12,9,s*.15,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle=p.accent;ctx.beginPath();ctx.arc(s*2,-1,4,0,TAU);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
    }

    // Main hull with stable graphic shadows.
    strokeFill(ship.hull,p.body,INK,5.5);
    ctx.save();ctx.clip(ship.hull);
    ctx.fillStyle=p.shade;ctx.fill(ship.shadow);
    const oc=ctx.createLinearGradient(-w*.4,-h*.1,w*.45,h*.45);
    oc.addColorStop(0,'rgba(6,8,20,0)');oc.addColorStop(1,rgba(p.deep,.45));
    ctx.fillStyle=oc;ctx.fillRect(-w,-h,w*2,h*2);
    ctx.fillStyle=rgba(p.hi,.7);ctx.fill(ship.highlight);
    // Gentle material mottling is attached to the ship, not randomized per frame.
    const rng=new RNG(ship.seed^0x51aa);
    for(let i=0;i<10;i++){
      ctx.globalAlpha=.05+rng.next()*.04;ctx.fillStyle=i%2?p.deep:p.hi;
      ctx.beginPath();ctx.ellipse(rng.range(-w*.32,w*.32),rng.range(-h*.35,h*.4),rng.range(2,6),rng.range(1,3),rng.range(0,TAU),0,TAU);ctx.fill();
    }
    ctx.restore();ctx.globalAlpha=alpha;

    // Nose plate adds a second material and a readable focal direction.
    const nose=new Path2D();nose.moveTo(0,-h*.57);nose.quadraticCurveTo(w*.23,-h*.44,w*.29,-h*.23);nose.quadraticCurveTo(0,-h*.31,-w*.28,-h*.20);nose.quadraticCurveTo(-w*.20,-h*.44,0,-h*.57);nose.closePath();
    ctx.fillStyle=mixColor(p.body,p.hi,.38);ctx.fill(nose);ctx.strokeStyle=INK;ctx.lineWidth=3.5;ctx.stroke(nose);

    // Cockpit: hard shadow, soft inner glow, and tiny animated glint.
    ctx.save();ctx.translate(0,0);
    strokeFill(ship.cockpit,p.glass,INK,4.5);
    ctx.save();ctx.clip(ship.cockpit);
    const cg=ctx.createLinearGradient(-w*.2,-h*.4,w*.22,-h*.03);
    cg.addColorStop(0,rgba(p.hi,.85));cg.addColorStop(.3,rgba(p.glass,.9));cg.addColorStop(.72,rgba(p.shade,.85));cg.addColorStop(1,rgba(p.deep,.95));
    ctx.fillStyle=cg;ctx.fillRect(-w,-h,w*2,h);
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-w*.08+ship.asym*6,-h*.30,w*.06,h*.035,-.35,0,TAU);ctx.fill();
    ctx.restore();ctx.restore();

    // Raised side blister casts a real graphic shadow and makes the silhouette feel built.
    {
      const s=ship.oddSide;
      ctx.save();ctx.translate(s*w*.31,h*.04);ctx.rotate(s*.12);
      ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(s*4,5,15,12,0,0,TAU);ctx.fill();
      ctx.fillStyle=mixColor(p.body,p.hi,.18);ctx.strokeStyle=INK;ctx.lineWidth=3.5;ctx.beginPath();ctx.ellipse(0,0,13,10,0,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle=p.deep;ctx.beginPath();ctx.ellipse(-s*2,1,5,4,0,0,TAU);ctx.fill();
      ctx.fillStyle=p.accent;ctx.beginPath();ctx.arc(s*5,-2,2.8,0,TAU);ctx.fill();
      ctx.restore();
    }

    // Interior panel lines, intentionally sparse and asymmetrical.
    ctx.strokeStyle=rgba(p.deep,.72);ctx.lineWidth=2.2;ctx.lineCap='round';
    for(let i=0;i<ship.panelCount;i++){
      const yy=lerp(-h*.02,h*.37,i/(Math.max(1,ship.panelCount-1)));
      const side=i%2?1:-1;
      ctx.beginPath();ctx.moveTo(side*w*.09,yy);ctx.quadraticCurveTo(side*w*.27,yy+4,side*w*.33,yy+12);ctx.stroke();
    }

    // Decal language.
    ctx.fillStyle=p.accent;ctx.strokeStyle=INK;ctx.lineWidth=2;
    if(ship.decal==='chevron'){
      ctx.beginPath();ctx.moveTo(-8,h*.17);ctx.lineTo(0,h*.25);ctx.lineTo(8,h*.17);ctx.lineTo(8,h*.24);ctx.lineTo(0,h*.32);ctx.lineTo(-8,h*.24);ctx.closePath();ctx.fill();ctx.stroke();

    }

    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.38;ctx.strokeStyle=p.hi;ctx.lineWidth=1.5;ctx.stroke(ship.hull);ctx.restore();
    ctx.restore();
  }

  function makePlanet(key,x,y,r,seed) {
    const type=planetTypes[key], rng=new RNG(seed);
    const blobs=[];
    for(let i=0;i<rng.int(5,9);i++) {
      blobs.push({a:rng.range(0,TAU), d:rng.range(0,r*.58), rx:rng.range(r*.11,r*.32), ry:rng.range(r*.06,r*.22), rot:rng.range(0,TAU), c:rng.chance(.55)?type.land:type.land2});
    }
    return { key,type,x,y,r,seed,blobs,phase:rng.range(0,TAU),ring:rng.chance(.28), discovered:true };
  }

  function drawPlanet(planet,sx,sy,time) {
    const {r,type}=planet;
    const screenR=r;
    // Atmosphere halo and distant contact shadow.
    ctx.save();
    const halo=ctx.createRadialGradient(sx-screenR*.18,sy-screenR*.2,screenR*.58,sx,sy,screenR*1.35);
    halo.addColorStop(0,rgba(type.atmosphere,.18)); halo.addColorStop(.62,rgba(type.atmosphere,.1)); halo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=halo;ctx.beginPath();ctx.arc(sx,sy,screenR*1.36,0,TAU);ctx.fill();
    ctx.shadowColor=rgba(type.atmosphere,.28);ctx.shadowBlur=18;
    ctx.fillStyle=type.body;ctx.strokeStyle=INK;ctx.lineWidth=6;ctx.beginPath();ctx.arc(sx,sy,screenR,0,TAU);ctx.fill();ctx.stroke();ctx.shadowBlur=0;

    ctx.save();ctx.beginPath();ctx.arc(sx,sy,screenR-2,0,TAU);ctx.clip();
    // Planet base tonality.
    const base=ctx.createRadialGradient(sx-screenR*.36,sy-screenR*.42,screenR*.08,sx,sy,screenR*1.12);
    base.addColorStop(0,type.light);base.addColorStop(.43,type.body);base.addColorStop(1,type.dark);
    ctx.fillStyle=base;ctx.fillRect(sx-r,sy-r,r*2,r*2);

    // Stable surface regions rotate almost imperceptibly.
    const drift=time*.008;
    for(const b of planet.blobs) {
      const a=b.a+drift, bx=sx+Math.cos(a)*b.d, by=sy+Math.sin(a)*b.d;
      ctx.save();ctx.translate(bx,by);ctx.rotate(b.rot+a*.13);
      ctx.fillStyle=b.c;ctx.beginPath();
      ctx.ellipse(0,0,b.rx,b.ry,0,0,TAU);ctx.fill();
      ctx.fillStyle=rgba(type.light,.16);ctx.beginPath();ctx.ellipse(-b.rx*.22,-b.ry*.28,b.rx*.55,b.ry*.35,-.2,0,TAU);ctx.fill();
      ctx.restore();
    }

    // Biome-specific surface language.
    if(type.biome==='lush') {
      ctx.strokeStyle='rgba(230,255,255,.48)';ctx.lineWidth=4;ctx.lineCap='round';
      for(let i=0;i<4;i++){
        const yy=sy-r*.55+i*r*.34+Math.sin(time*.15+i)*2;
        ctx.beginPath();ctx.arc(sx-r*.05,yy,r*(.35-i*.02),.15,.9);ctx.stroke();
      }
    } else if(type.biome==='desert') {
      ctx.strokeStyle='rgba(255,219,142,.24)';ctx.lineWidth=5;
      for(let i=0;i<5;i++){
        ctx.beginPath();ctx.arc(sx-r*.1,sy-r*.1,r*(.22+i*.11),1.1,2.65);ctx.stroke();
      }
    } else {
      ctx.strokeStyle='rgba(233,255,255,.45)';ctx.lineWidth=3;
      for(let i=0;i<7;i++){
        const a=i*.9+planet.phase;ctx.beginPath();ctx.moveTo(sx+Math.cos(a)*r*.15,sy+Math.sin(a)*r*.15);ctx.lineTo(sx+Math.cos(a+.2)*r*.72,sy+Math.sin(a+.2)*r*.72);ctx.stroke();
      }
    }

    // Graphic night-side shadow, softened only at the boundary.
    const sh=ctx.createLinearGradient(sx-r*.55,sy-r*.35,sx+r*.8,sy+r*.65);
    sh.addColorStop(0,'rgba(5,8,19,0)');sh.addColorStop(.52,'rgba(5,8,19,.04)');sh.addColorStop(1,'rgba(5,8,19,.78)');

    ctx.strokeStyle=rgba(type.light,.55);ctx.lineWidth=3.2;ctx.beginPath();ctx.arc(sx,sy,r-4,2.9,5.1);ctx.stroke();

    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Asteroids + debris
  // ---------------------------------------------------------------------------
  function makeAsteroid(rng,i) {
    const r=rng.range(18,58), verts=rng.int(8,13), pts=[];
    for(let j=0;j<verts;j++){
      const a=j/verts*TAU, rad=r*rng.range(.76,1.12);
      pts.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad});
    }
    const path=new Path2D();path.moveTo(pts[0].x,pts[0].y);for(let j=1;j<pts.length;j++)path.lineTo(pts[j].x,pts[j].y);path.closePath();
    const craters=[];for(let c=0;c<rng.int(1,4);c++)craters.push({x:rng.range(-r*.42,r*.42),y:rng.range(-r*.35,r*.35),rx:rng.range(r*.08,r*.22),ry:rng.range(r*.06,r*.17),rot:rng.range(0,TAU)});
    return {
      x:rng.range(-1700,1700), y:rng.range(-1300,1300), r, path, craters,
      rot:rng.range(0,TAU), spin:rng.range(-.08,.08), vx:rng.range(-7,7),vy:rng.range(-7,7),
      hue:rng.pick(['#8a8093','#786e72','#9b806d','#6f7184','#75647f']),
      shade:rng.pick(['#403c4d','#493c43','#57483e','#363b4a']),
      hi:rng.pick(['#c9bac3','#bda99d','#b4aebd','#a9b4c5']),
      cooldown:0, id:i
    };
  }

  function drawAsteroid(a,sx,sy,time) {
    ctx.save();ctx.translate(sx,sy);ctx.rotate(a.rot);
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10;ctx.shadowOffsetX=5;ctx.shadowOffsetY=8;
    strokeFill(a.path,a.hue,INK,4.5);ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
    ctx.save();ctx.clip(a.path);
    const sh=ctx.createLinearGradient(-a.r*.7,-a.r*.65,a.r*.65,a.r*.8);
    sh.addColorStop(0,rgba(a.hi,.55));sh.addColorStop(.35,'rgba(255,255,255,.02)');sh.addColorStop(1,rgba(a.shade,.88));ctx.fillStyle=sh;ctx.fillRect(-a.r,-a.r,a.r*2,a.r*2);
    ctx.restore();
    for(const c of a.craters){
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
      ctx.fillStyle=rgba(a.shade,.86);ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,0,c.rx,c.ry,0,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle=rgba(a.hi,.4);ctx.beginPath();ctx.ellipse(-c.rx*.16,-c.ry*.24,c.rx*.68,c.ry*.45,0,Math.PI,TAU);ctx.fill();ctx.restore();
    }
    // Deliberate edge nick / ink break.
    ctx.strokeStyle=rgba(a.hi,.42);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(-a.r*.1,-a.r*.1,a.r*.62,3.5,4.8);ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Particles
  // ---------------------------------------------------------------------------
  const particles=[];
  function emitParticle(p){ particles.push(p); if(particles.length>650) particles.splice(0,particles.length-650); }
  function emitExhaust(dt, boost) {
    const thrust=player.thrust;
    if(thrust<.05) return;
    const count=Math.min(6,Math.ceil((thrust*18+boost*20)*dt));
    const fwd={x:Math.sin(player.angle),y:-Math.cos(player.angle)};
    const right={x:Math.cos(player.angle),y:Math.sin(player.angle)};
    for(let side of [-1,1]) for(let i=0;i<count;i++) {
      const ship=player.ship;
      const px=player.x + right.x*side*ship.w*.42 + fwd.x*ship.h*.29;
      const py=player.y + right.y*side*ship.w*.42 + fwd.y*ship.h*.29;
      const speed=160+Math.random()*110+boost*220;
      emitParticle({
        type:'exhaust',x:px,y:py,
        vx:player.vx-fwd.x*speed+right.x*(Math.random()-.5)*35,
        vy:player.vy-fwd.y*speed+right.y*(Math.random()-.5)*35,
        life:.3+Math.random()*.36,max:.66,size:3+Math.random()*7+boost*4,
        color:player.ship.p.glass
      });
    }
  }
  function emitImpact(x,y,n=18) {
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU,s=Math.random()*220+60;
      emitParticle({type:i%3?'spark':'debris',x,y,vx:Math.cos(a)*s+player.vx*.2,vy:Math.sin(a)*s+player.vy*.2,life:.35+Math.random()*.65,max:1,size:1.5+Math.random()*3,color:i%2?player.ship.p.accent:'#ffffff'});
    }
  }
  function updateParticles(dt) {
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.type==='exhaust'){p.vx*=Math.pow(.94,dt*60);p.vy*=Math.pow(.94,dt*60);p.size+=dt*9;}
      else {p.vy+=14*dt;p.vx*=Math.pow(.985,dt*60);p.vy*=Math.pow(.985,dt*60);}
    }
  }
  function drawParticles() {
    ctx.save();
    for(const p of particles){
      const sx=p.x-player.x+W/2+cameraShakeX, sy=p.y-player.y+H/2+cameraShakeY;
      const t=p.life/p.max;
      if(p.type==='exhaust'){
        ctx.globalCompositeOperation='lighter';ctx.globalAlpha=t*.58;
        const g=ctx.createRadialGradient(sx,sy,0,sx,sy,p.size*2.1);g.addColorStop(0,'rgba(230,255,255,.9)');g.addColorStop(.25,rgba(p.color,.7));g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,p.size*2.1,0,TAU);ctx.fill();
      } else if(p.type==='spark'){
        ctx.globalCompositeOperation='lighter';ctx.globalAlpha=t;ctx.strokeStyle=p.color;ctx.lineWidth=1.2+t*1.8;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-p.vx*.025,sy-p.vy*.025);ctx.stroke();
      } else {
        ctx.globalCompositeOperation='source-over';ctx.globalAlpha=t;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sx,sy,p.size*t,0,TAU);ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // World state and generation
  // ---------------------------------------------------------------------------
  let systemSeed = 481516;
  let asteroids=[], planets=[];
  let player;
  let time=0, last=performance.now(), frameDt=0;
  let nearestPlanet=null, nearestDistance=Infinity;
  let cameraShake=0,cameraShakeX=0,cameraShakeY=0;
  let flash=0;

  function regenerate(seed=(Math.random()*0xffffffff)>>>0) {
    systemSeed=seed>>>0;
    const rng=new RNG(systemSeed);
    const ship=buildShip(systemSeed^0x4219);
    player={x:0,y:0,vx:0,vy:0,angle:0,angleVel:0,thrust:0,boost:0,energy:100,shield:100,hull:100,ship,turnVisual:0,centerLagX:0,centerLagY:0};
    asteroids=[];
    for(let i=0;i<70;i++){
      const a=makeAsteroid(rng,i);
      // Keep the starting pocket readable.
      if(Math.hypot(a.x,a.y)<240){a.x+=Math.sign(a.x||1)*320;a.y+=Math.sign(a.y||1)*180;}
      asteroids.push(a);
    }
    planets=[
      makePlanet('verdania',760,-260,118,systemSeed^0x101),
      makePlanet('rusthollow',-980,540,104,systemSeed^0x202),
      makePlanet('glacia',520,1050,92,systemSeed^0x303)
    ];
    particles.length=0;buildNebulaTexture();
    toast(`SYSTEM ${String(systemSeed).padStart(6,'0').slice(-6)} GENERATED`,2.0);
  }

  // ---------------------------------------------------------------------------
  // Input + touch controls
  // ---------------------------------------------------------------------------
  const keys=new Set();
  let touchStick=null;
  let pointerDown=false;
  const hit={boost:null,land:null,reseed:null,depart:null};
  addEventListener('keydown',e=>{
    ensureAudio();
    const k=e.key.toLowerCase();keys.add(k);
    if(['arrowup','arrowdown','arrowleft','arrowright',' ','e'].includes(k))e.preventDefault();
    if(k==='r'&&!e.repeat) regenerate();
    if((k==='e'||k==='enter')&&!e.repeat){ if(landing.mode!=='flight') departLanding(); else attemptLand(); }
    if(k==='escape'&&landing.mode!=='flight') departLanding();
  });
  addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

  canvas.addEventListener('pointerdown',e=>{
    ensureAudio();pointerDown=true;canvas.setPointerCapture(e.pointerId);
    const x=e.clientX,y=e.clientY;
    if(landing.mode!=='flight'){
      if(hit.depart&&pointIn(x,y,hit.depart))departLanding();
      return;
    }
    if(hit.land&&pointIn(x,y,hit.land)){attemptLand();return;}
    if(hit.boost&&pointIn(x,y,hit.boost)){keys.add('shift');return;}
    if(hit.reseed&&pointIn(x,y,hit.reseed)){regenerate();return;}
    if(x<W*.65){touchStick={id:e.pointerId,ox:x,oy:y,x,y};}
  });
  canvas.addEventListener('pointermove',e=>{if(touchStick&&touchStick.id===e.pointerId){touchStick.x=e.clientX;touchStick.y=e.clientY;}});
  function releasePointer(e){pointerDown=false;if(touchStick&&touchStick.id===e.pointerId)touchStick=null;keys.delete('shift');}
  canvas.addEventListener('pointerup',releasePointer);canvas.addEventListener('pointercancel',releasePointer);
  function pointIn(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}

  function getInput() {
    let x=0,y=0;
    if(keys.has('a')||keys.has('arrowleft'))x--;
    if(keys.has('d')||keys.has('arrowright'))x++;
    if(keys.has('w')||keys.has('arrowup'))y--;
    if(keys.has('s')||keys.has('arrowdown'))y++;
    if(touchStick){
      const dx=touchStick.x-touchStick.ox,dy=touchStick.y-touchStick.oy,m=Math.hypot(dx,dy),limit=70;
      if(m>5){x=dx/Math.max(limit,m);y=dy/Math.max(limit,m);}
    }
    const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}
    return {x,y,m:Math.min(1,m),boost:keys.has('shift')||keys.has(' ')};
  }

  // ---------------------------------------------------------------------------
  // Landing state and generated animated landscape illustrations
  // ---------------------------------------------------------------------------
  const landing={mode:'flight',planet:null,t:0,departing:false};
  function attemptLand(){
    if(nearestPlanet&&nearestDistance<nearestPlanet.r+255){
      landing.mode='entering';landing.planet=nearestPlanet;landing.t=0;landing.departing=false;uiChime(true);
    } else toast('NO LANDABLE WORLD IN RANGE',1.5);
  }
  function departLanding(){
    if(landing.mode==='flight'||landing.mode==='departing')return;
    landing.mode='departing';landing.t=0;uiChime(false);
  }
  function updateLanding(dt){
    if(landing.mode==='entering'){landing.t+=dt;if(landing.t>.72){landing.mode='landed';landing.t=0;}}
    else if(landing.mode==='departing'){landing.t+=dt;if(landing.t>.55){landing.mode='flight';landing.planet=null;landing.t=0;}}
  }

  function drawCloud(x,y,s,alpha=.7,tint='#edf7ff'){
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=alpha;ctx.fillStyle=tint;
    ctx.beginPath();ctx.arc(-20,2,14,0,TAU);ctx.arc(-5,-6,18,0,TAU);ctx.arc(13,0,14,0,TAU);ctx.arc(28,5,10,0,TAU);ctx.rect(-22,0,52,14);ctx.fill();ctx.restore();
  }
  function drawMountainRange(baseY,amp,count,offset,color,strokeColor,seed,parallax=0){
    const rng=new RNG(seed);ctx.beginPath();ctx.moveTo(-40,H+20);ctx.lineTo(-40,baseY);
    let x=-40+offset;
    for(let i=0;i<count;i++){
      const w=lerp(W/(count-1)*.7,W/(count-1)*1.35,rng.next());
      const peak=baseY-rng.range(amp*.45,amp);
      ctx.quadraticCurveTo(x+w*.28,peak-rng.range(0,amp*.15),x+w*.5,peak);
      ctx.quadraticCurveTo(x+w*.72,peak+rng.range(amp*.1,amp*.35),x+w,baseY+rng.range(-8,12));
      x+=w;
    }
    ctx.lineTo(W+40,H+20);ctx.closePath();ctx.fillStyle=color;ctx.fill();
    if(strokeColor){ctx.strokeStyle=strokeColor;ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();}
  }

  function landscapeRect(){
    const margin=clamp(W*.035,18,56), top=clamp(H*.105,72,105), bottom=clamp(H*.12,84,120);
    const infoW=clamp(W*.29,300,430), gap=20;
    return {x:margin,y:top,w:W-margin*2-infoW-gap,h:H-top-bottom, infoX:W-margin-infoW,infoW,gap};
  }

  function drawVerdaniaLandscape(r,time,seed){
    const rng=new RNG(seed);ctx.save();ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,20);ctx.clip();
    const sky=ctx.createLinearGradient(0,r.y,0,r.y+r.h);sky.addColorStop(0,'#62c8dc');sky.addColorStop(.43,'#79d7cd');sky.addColorStop(1,'#274e79');ctx.fillStyle=sky;ctx.fillRect(r.x,r.y,r.w,r.h);
    // Large distant moon and humid glow.
    const mx=r.x+r.w*.78,my=r.y+r.h*.19,mr=Math.min(r.w,r.h)*.12;
    const mg=ctx.createRadialGradient(mx-mr*.3,my-mr*.35,2,mx,my,mr);mg.addColorStop(0,'#fff2ce');mg.addColorStop(.65,'#e9cfa6');mg.addColorStop(1,'#9da79e');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,mr,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(230,255,238,.18)';ctx.fillRect(r.x,r.y+r.h*.32,r.w,r.h*.22);
    // Clouds travel at different rates but keep stable silhouettes.
    for(let i=0;i<6;i++){
      const x=r.x+(((i*.19*r.w+time*(4+i*1.3))%(r.w+180))-90), y=r.y+r.h*(.08+(i%3)*.095);
      drawCloud(x,y,.7+(i%2)*.28,.24+(i%3)*.08,'#effff4');
    }
    // Far teal mountain bands.
    ctx.save();ctx.translate(r.x,r.y);drawMountainRange(r.h*.60,r.h*.23,9,-time*.8,'#477d88',null,seed^11);drawMountainRange(r.h*.68,r.h*.28,8,time*.35,'#315f71',null,seed^12);ctx.restore();
    // Ocean plane.
    const waterY=r.y+r.h*.67;const wg=ctx.createLinearGradient(0,waterY,0,r.y+r.h);wg.addColorStop(0,'#3ca5ac');wg.addColorStop(1,'#183b63');ctx.fillStyle=wg;ctx.fillRect(r.x,waterY,r.w,r.h*.35);
    // Island silhouettes and waterfalls.
    for(let i=0;i<3;i++){
      const ix=r.x+r.w*(.19+i*.29),iy=waterY-r.h*(.08+(i%2)*.09),iw=r.w*(.16+(i%2)*.05),ih=r.h*(.16+(i%2)*.06);
      ctx.fillStyle='#203d50';ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(ix-iw*.5,iy);ctx.quadraticCurveTo(ix-iw*.26,iy-ih*.75,ix,iy-ih);ctx.quadraticCurveTo(ix+iw*.35,iy-ih*.7,ix+iw*.5,iy);ctx.quadraticCurveTo(ix+iw*.28,iy+ih*.25,ix,iy+ih*.45);ctx.quadraticCurveTo(ix-iw*.25,iy+ih*.18,ix-iw*.5,iy);ctx.fill();ctx.stroke();
      ctx.fillStyle='#5bc16c';ctx.beginPath();ctx.ellipse(ix,iy-ih*.76,iw*.34,ih*.18,-.08,0,TAU);ctx.fill();
      ctx.strokeStyle='#b4fff3';ctx.lineWidth=3;ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(ix+iw*.08,iy-ih*.67);ctx.bezierCurveTo(ix+iw*.1,iy-ih*.2,ix+iw*.05,iy+ih*.02,ix+iw*.1,waterY+10);ctx.stroke();ctx.globalAlpha=1;
    }
    // Foreground cliff framing, rich three-value treatment.
    const fgY=r.y+r.h*.83;ctx.fillStyle='#172d3d';ctx.strokeStyle=INK;ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(r.x,r.y+r.h);ctx.lineTo(r.x,fgY-r.h*.08);ctx.quadraticCurveTo(r.x+r.w*.08,fgY-r.h*.24,r.x+r.w*.18,fgY-r.h*.1);ctx.lineTo(r.x+r.w*.28,r.y+r.h);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(r.x+r.w*.72,r.y+r.h);ctx.lineTo(r.x+r.w*.79,fgY-r.h*.15);ctx.quadraticCurveTo(r.x+r.w*.9,fgY-r.h*.28,r.x+r.w,fgY-r.h*.09);ctx.lineTo(r.x+r.w,r.y+r.h);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#3a8859';ctx.beginPath();ctx.ellipse(r.x+r.w*.12,fgY-r.h*.14,r.w*.09,r.h*.045,-.25,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(r.x+r.w*.89,fgY-r.h*.17,r.w*.1,r.h*.045,.2,0,TAU);ctx.fill();
    // Settlement lights.
    for(let i=0;i<9;i++){
      const bx=r.x+r.w*(.42+i*.018),by=waterY-r.h*(.02+(i%3)*.015),bh=r.h*(.04+(i%4)*.018);ctx.fillStyle='#17374e';ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.fillRect(bx,by-bh,r.w*.013,bh);ctx.strokeRect(bx,by-bh,r.w*.013,bh);
      ctx.fillStyle=i%2?'#ffd77b':'#7ef2cd';ctx.globalAlpha=.55+.35*Math.sin(time*2+i);ctx.fillRect(bx+2,by-bh+4,2.5,2.5);ctx.globalAlpha=1;
    }
    // Water glints.
    ctx.strokeStyle='rgba(171,255,244,.48)';ctx.lineWidth=2;
    for(let i=0;i<16;i++){const yy=waterY+12+i*r.h*.018,xx=r.x+((i*117+time*14)%(r.w*.9));ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+r.w*(.025+(i%3)*.012),yy);ctx.stroke();}
    // Birds.
    ctx.strokeStyle='rgba(12,31,45,.7)';ctx.lineWidth=1.7;
    for(let i=0;i<4;i++){const bx=r.x+r.w*(.3+i*.06)+Math.sin(time*.5+i)*8,by=r.y+r.h*(.25+i*.025);ctx.beginPath();ctx.arc(bx-4,by,5,3.5,5.8);ctx.arc(bx+4,by,5,3.6,5.9);ctx.stroke();}
    ctx.restore();
  }

  function drawRustLandscape(r,time,seed){
    ctx.save();ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,20);ctx.clip();
    const sky=ctx.createLinearGradient(0,r.y,0,r.y+r.h);sky.addColorStop(0,'#6a3c61');sky.addColorStop(.43,'#bd684c');sky.addColorStop(1,'#e79b5c');ctx.fillStyle=sky;ctx.fillRect(r.x,r.y,r.w,r.h);
    const sunX=r.x+r.w*.76,sunY=r.y+r.h*.19,sunR=Math.min(r.w,r.h)*.11;ctx.fillStyle='#ffd28a';ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,211,146,.14)';ctx.beginPath();ctx.arc(sunX,sunY,sunR*1.7,0,TAU);ctx.fill();
    // Dust clouds.

  function updateFlight(dt) {
    const input=getInput();
    const boosting=input.boost&&player.energy>2&&input.m>.05;
    const accel=boosting?560:340,max=boosting?530:340;
    player.energy=clamp(player.energy+(boosting?-24:13)*dt,0,100);
    player.boost=smooth(player.boost,boosting?1:0,7,dt);
    player.thrust=smooth(player.thrust,input.m,8,dt);
    if(input.m>.02){
      player.vx+=input.x*accel*dt;player.vy+=input.y*accel*dt;
      const target=Math.atan2(input.y,input.x)+Math.PI/2;
      const d=shortestAngle(player.angle,target);
      player.angleVel+=d*15*dt;player.angleVel*=Math.pow(.84,dt*60);
      player.angle+=player.angleVel*dt*4.8;
      player.turnVisual=smooth(player.turnVisual,clamp(d*1.4,-1,1),7,dt);
    } else {
      player.turnVisual=smooth(player.turnVisual,0,5,dt);player.angleVel*=Math.pow(.84,dt*60);
    }
    const speed=Math.hypot(player.vx,player.vy);
    if(speed>max){const s=max/speed;player.vx*=s;player.vy*=s;}
    const drag=input.m>.02?.997:.985;player.vx*=Math.pow(drag,dt*60);player.vy*=Math.pow(drag,dt*60);
    player.x+=player.vx*dt;player.y+=player.vy*dt;
    // Secondary parts follow turn / acceleration through damped values.
    const lagTarget=clamp(speed/max,0,1)*.35+player.boost*.6;
    player.ship.podLagL=smooth(player.ship.podLagL,lagTarget+player.turnVisual*.18,5,dt);
    player.ship.podLagR=smooth(player.ship.podLagR,lagTarget-player.turnVisual*.18,5,dt);
    player.ship.finLag=smooth(player.ship.finLag,-player.turnVisual,5.5,dt);
    // Elastic center leash: visually alive, still functionally centered.
    player.centerLagX=smooth(player.centerLagX,-player.vx*.028,4,dt);
    player.centerLagY=smooth(player.centerLagY,-player.vy*.028,4,dt);
    emitExhaust(dt,player.boost);

    nearestPlanet=null;nearestDistance=Infinity;
    for(const p of planets){const d=Math.hypot(player.x-p.x,player.y-p.y);if(d<nearestDistance){nearestDistance=d;nearestPlanet=p;}}

    for(const a of asteroids){
      a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.spin*dt;a.cooldown=Math.max(0,a.cooldown-dt);
      const dx=player.x-a.x,dy=player.y-a.y,d=Math.hypot(dx,dy),min=a.r+24;
      if(d<min&&a.cooldown<=0){
        const nx=dx/(d||1),ny=dy/(d||1),rel=player.vx*nx+player.vy*ny;
        player.x=a.x+nx*min;player.y=a.y+ny*min;
        player.vx+=nx*(100+Math.abs(rel)*1.15);player.vy+=ny*(100+Math.abs(rel)*1.15);
        player.shield=clamp(player.shield-(4+Math.abs(rel)*.025),0,100);cameraShake=Math.min(18,cameraShake+8+Math.abs(rel)*.02);flash=.35;
        emitImpact(player.x-nx*18,player.y-ny*18,20);impactSound();a.cooldown=.8;
      }
    }
    cameraShake=smooth(cameraShake,0,7,dt);cameraShakeX=(Math.random()-.5)*cameraShake;cameraShakeY=(Math.random()-.5)*cameraShake;
    player.shield=clamp(player.shield+2.2*dt,0,100);flash=Math.max(0,flash-dt);
  }

  // ---------------------------------------------------------------------------
  // Flight rendering
  // ---------------------------------------------------------------------------
  function worldToScreen(x,y){return {x:x-player.x+W/2+cameraShakeX,y:y-player.y+H/2+cameraShakeY};}

  function drawWorld() {
    // Planets behind asteroids; distance-based atmosphere still makes them feel huge.
    for(const p of planets){const s=worldToScreen(p.x,p.y);if(s.x>-p.r*1.7&&s.x<W+p.r*1.7&&s.y>-p.r*1.7&&s.y<H+p.r*1.7)drawPlanet(p,s.x,s.y,time);}
    // Soft system trajectory traces.
    ctx.save();ctx.globalAlpha=.12;ctx.setLineDash([2,10]);ctx.lineWidth=1;ctx.strokeStyle='#a6cee4';
    for(const p of planets){const s=worldToScreen(p.x,p.y);ctx.beginPath();ctx.arc(s.x,s.y,p.r+42,0,TAU);ctx.stroke();}
    ctx.restore();
    for(const a of asteroids){const s=worldToScreen(a.x,a.y);if(s.x>-a.r*2&&s.x<W+a.r*2&&s.y>-a.r*2&&s.y<H+a.r*2)drawAsteroid(a,s.x,s.y,time);}
    drawParticles();
  }

  function drawShipAndEffects() {
    const x=W/2+clamp(player.centerLagX,-13,13)+cameraShakeX*.25;
    const y=H/2+clamp(player.centerLagY,-13,13)+cameraShakeY*.25;
    // Velocity streaks only during boost; restrained and behind the focal object.
    if(player.boost>.05){
      const f={x:Math.sin(player.angle),y:-Math.cos(player.angle)};ctx.save();ctx.globalAlpha=player.boost*.22;ctx.strokeStyle=player.ship.p.glass;ctx.lineWidth=1.2;
      for(let i=0;i<16;i++){const a=(i*47.31+systemSeed)%W,b=(i*i*19.7+time*220)%H;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(a-f.x*(20+i%4*9),b-f.y*(20+i%4*9));ctx.stroke();}
      ctx.restore();
    }
    ctx.save();ctx.translate(x,y);ctx.scale(1.22,1.22);drawShip(player.ship,0,0,player.angle,player.thrust,player.boost,player.turnVisual,time);ctx.restore();
    // Shield contour after impacts.
    if(flash>0){ctx.save();ctx.globalAlpha=flash*1.6;ctx.strokeStyle=player.ship.p.glass;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,player.ship.w*.8,player.ship.h*.78,player.angle,0,TAU);ctx.stroke();ctx.restore();}
  }

  function drawRadar() {
    const r=58,x=28+r,y=26+r;panel(20,18,130,130,24,.72);
    ctx.save();ctx.translate(x,y);ctx.strokeStyle='rgba(183,210,232,.18)';ctx.lineWidth=1;for(const rr of [20,39,57]){ctx.beginPath();ctx.arc(0,0,rr,0,TAU);ctx.stroke();}line(-r,0,r,0,'rgba(183,210,232,.11)');line(0,-r,0,r,'rgba(183,210,232,.11)');
    const range=1500;
    for(const p of planets){const dx=(p.x-player.x)/range*r,dy=(p.y-player.y)/range*r;if(Math.hypot(dx,dy)<r){ctx.fillStyle=p.type.accent;ctx.beginPath();ctx.arc(dx,dy,3.5,0,TAU);ctx.fill();}}
    for(let i=0;i<asteroids.length;i+=4){const a=asteroids[i],dx=(a.x-player.x)/range*r,dy=(a.y-player.y)/range*r;if(Math.hypot(dx,dy)<r){ctx.fillStyle='rgba(219,224,235,.33)';ctx.beginPath();ctx.arc(dx,dy,1.4,0,TAU);ctx.fill();}}
    ctx.rotate(player.angle);ctx.fillStyle=player.ship.p.accent;ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(5,6);ctx.lineTo(0,3);ctx.lineTo(-5,6);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  }

  function drawBar(x,y,w,labelText,value,color,icon='') {
    label(labelText,x,y,9,'#8da3b8');
    ctx.fillStyle='rgba(255,255,255,.07)';ctx.fill(rr(x,y+8,w,8,4));ctx.fillStyle=color;ctx.fill(rr(x,y+8,w*clamp(value/100,0,1),8,4));
    text(String(Math.round(value)),x+w+11,y+16,11,800,'#dfeaf4');
  }

  function drawHUD() {
    drawRadar();
    // Top title strip.
    const titleW=clamp(W*.32,280,460);panel(W/2-titleW/2,18,titleW,46,15,.66);label('INKSTAR / PROCEDURAL CARTOON ENGINE',W/2,38,10,'#b7c7db','center');text('HYBRID POLISH SLICE',W/2,55,10,850,player.ship.p.accent,'center');
    // Reseed button.
    const rb={x:W-152,y:20,w:132,h:40};hit.reseed=rb;panel(rb.x,rb.y,rb.w,rb.h,13,.72);label('SYSTEM SEED',rb.x+14,rb.y+16,8,'#7f96aa');text(String(systemSeed).slice(-6),rb.x+14,rb.y+32,12,850,'#edf5ff');text(coarsePointer?'↻':'R',rb.x+rb.w-17,rb.y+28,13,900,player.ship.p.accent,'center');
    // Status cluster.
    const pw=244,ph=104,px=22,py=H-ph-22;panel(px,py,pw,ph,17,.8);drawBar(px+17,py+24,150,'SHIELD',player.shield,player.ship.p.glass);drawBar(px+17,py+52,150,'ENERGY',player.energy,player.ship.p.accent);drawBar(px+17,py+80,150,'HULL',player.hull,'#6fe09c');
    // Flight data.
    const dw=220,dh=86,dx=W-dw-22,dy=H-dh-22;panel(dx,dy,dw,dh,17,.8);label('VELOCITY',dx+18,dy+23,9,'#8da3b8');text(`${Math.round(Math.hypot(player.vx,player.vy))} u/s`,dx+18,dy+47,22,900,'#edf5ff');label('CREDITS',dx+18,dy+70,8,'#8da3b8');text('42,650',dx+dw-18,dy+70,11,850,'#ffd66e','right');

    // Contextual landing card.
    hit.land=null;
    if(nearestPlanet&&nearestDistance<nearestPlanet.r+430){
      const p=nearestPlanet,type=p.type,near=nearestDistance<p.r+255;
      const cw=clamp(W*.29,300,410),ch=near?156:112,cx=W-cw-22,cy=82;panel(cx,cy,cw,ch,18,.86);
      ctx.fillStyle=rgba(type.accent,.18);ctx.beginPath();ctx.arc(cx+32,cy+33,16,0,TAU);ctx.fill();ctx.strokeStyle=rgba(type.accent,.65);ctx.lineWidth=2;ctx.stroke();
      label('LANDABLE WORLD',cx+58,cy+25,8,type.accent);text(type.name,cx+58,cy+47,18,900,'#edf5ff');
      text(type.subtitle,cx+20,cy+76,12,600,'#a9bed1');
      label('DISTANCE',cx+20,cy+99,8,'#768ea5');text(`${Math.max(0,Math.round(nearestDistance-p.r))} u`,cx+cw-20,cy+99,10,850,'#dce8f4','right');
      if(near){const b={x:cx+18,y:cy+112,w:cw-36,h:32};hit.land=b;ctx.fillStyle=rgba(type.accent,.18);ctx.strokeStyle=rgba(type.accent,.72);ctx.lineWidth=1.5;ctx.fill(rr(b.x,b.y,b.w,b.h,10));ctx.stroke(rr(b.x+.6,b.y+.6,b.w-1.2,b.h-1.2,10));text(coarsePointer?'LAND':'LAND  [E]',b.x+b.w/2,b.y+21,11,900,type.accent,'center');}
    }

    // Controls: terse and unobtrusive.
    if(!coarsePointer){label('WASD / ARROWS  MOVE     SHIFT  BOOST     E  LAND     R  RESEED',W/2,H-20,9,'rgba(189,205,222,.58)','center');}
    else drawTouchControls();
  }

  function drawTouchControls(){
    // Joystick appears where the player touches; a ghost ring hints at the interaction.
    const ox=touchStick?touchStick.ox:76,oy=touchStick?touchStick.oy:H-92;
    ctx.save();ctx.globalAlpha=touchStick?.62:.22;ctx.strokeStyle='#dcecff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ox,oy,42,0,TAU);ctx.stroke();
    if(touchStick){const dx=touchStick.x-ox,dy=touchStick.y-oy,m=Math.hypot(dx,dy),s=Math.min(32,m),x=ox+(dx/(m||1))*s,y=oy+(dy/(m||1))*s;ctx.fillStyle=rgba(player.ship.p.accent,.35);ctx.beginPath();ctx.arc(x,y,18,0,TAU);ctx.fill();ctx.stroke();}
    ctx.restore();
    const b={x:W-94,y:H-180,w:64,h:64};hit.boost=b;ctx.save();ctx.globalAlpha=.78;ctx.fillStyle=rgba(player.ship.p.glass,.13);ctx.strokeStyle=rgba(player.ship.p.glass,.5);ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,32,0,TAU);ctx.fill();ctx.stroke();text('BOOST',b.x+b.w/2,b.y+37,9,900,player.ship.p.glass,'center');ctx.restore();
  }

  let toastText='',toastT=0;
  function toast(s,t=1.5){toastText=s;toastT=t;}
  function drawToast(){
    if(toastT<=0)return;const a=clamp(toastT/.35,0,1)*clamp((2.2-toastT)/.35+1,0,1);const w=Math.min(430,W-40);ctx.save();ctx.globalAlpha=Math.min(1,a);panel(W/2-w/2,H*.14,w,38,12,.8);label(toastText,W/2,H*.14+24,9,'#dfeaf5','center');ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------------
  function frame(now){
    const raw=(now-last)/1000;last=now;frameDt=Math.min(.033,Math.max(.001,raw));time+=frameDt;toastT=Math.max(0,toastT-frameDt);
    updateLanding(frameDt);
    if(landing.mode==='flight')updateFlight(frameDt);else {player.thrust=smooth(player.thrust,.08,3,frameDt);player.boost=smooth(player.boost,0,5,frameDt);updateAudio(.05,0);}
    updateParticles(frameDt);updateAudio(player.thrust,player.boost);
    drawBackground(time);
    drawWorld();
    drawShipAndEffects();
    if(landing.mode==='flight')drawHUD();
    else drawLandingScene();
    drawToast();
    requestAnimationFrame(frame);
  }

  resize();regenerate(481516);
  // Query-string preview modes make the single file easy to art-direct and test.
  const params=new URLSearchParams(location.search);
  if(params.has('seed'))regenerate(Number(params.get('seed'))||481516);
  if(params.has('landed')){
    const key=params.get('landed');const p=planets.find(q=>q.key===key)||planets[0];landing.mode='landed';landing.planet=p;
  }
  setTimeout(()=>boot.classList.add('hidden'),350);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
