 paint=off;buildParticles(sol);return off;
}
function buildParticles(sol){var q=new RNG(sol.seed^0xa81c9),p=palettes[paletteIndex];stars=[];motes=[];for(var i=0;i<150;i++)stars.push({x:q.range(0,W),y:q.range(0,H),r:q.range(.45,1.5),a:q.range(.18,.78),tw:q.range(.7,2.4),phase:q.range(0,6.28)});for(var y=0;y<sol.rows;y++)for(var x=0;x<sol.cols;x++){var t=TILES[sol.cells[y*sol.cols+x]];if(t.kind==="knot"||t.kind==="core"){var count=t.kind==="core"?9:4;for(i=0;i<count;i++)motes.push({x:(x+.5+q.range(-.35,.35))*W/sol.cols,y:(y+.5+q.range(-.35,.35))*H/sol.rows,r:q.range(1,3),phase:q.range(0,6.28),speed:q.range(.45,1.4),color:q.next()>.4?p.hot:p.glow})}}}
function drawStructure(sol){var cw=W/sol.cols,ch=H/sol.rows,dustAngle=((sol.seed>>>8)%628)/100;ctx.save();ctx.globalAlpha=.88;for(var y=0;y<sol.rows;y++)for(var x=0;x<sol.cols;x++){var idx=y*sol.cols+x,t=TILES[sol.cells[idx]],cx=(x+.5)*cw,cy=(y+.5)*ch;if(t.kind==="void")ctx.fillStyle="rgba(4,7,15,.52)";else if(t.kind==="haze")ctx.fillStyle="rgba(93,150,183,.34)";else if(t.kind==="dense")ctx.fillStyle="rgba(171,115,218,.42)";else if(t.kind==="core")ctx.fillStyle="rgba(255,215,255,.66)";else if(t.kind==="knot")ctx.fillStyle="rgba(239,161,255,.58)";else if(t.kind==="filament")ctx.fillStyle="rgba(70,196,232,.34)";else ctx.fillStyle="rgba(15,21,45,.72)";ctx.fillRect(x*cw+.6,y*ch+.6,cw-1.2,ch-1.2);ctx.strokeStyle="rgba(255,255,255,.10)";ctx.strokeRect(x*cw+.5,y*ch+.5,cw-1,ch-1);
   if(t.kind==="filament"){ctx.strokeStyle="rgba(158,239,255,.93)";ctx.lineWidth=Math.max(1.2,Math.min(cw,ch)*.12);ctx.lineCap="round";var made=false;for(var d=0;d<4;d++){var nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=sol.cols||ny>=sol.rows)continue;var nt=TILES[sol.cells[ny*sol.cols+nx]];if(nt.kind==="filament"||nt.kind==="dense"||nt.kind==="core"||nt.kind==="knot"){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+DX[d]*cw*.5,cy+DY[d]*ch*.5);ctx.stroke();made=true}}if(!made){ctx.beginPath();ctx.moveTo(cx-cw*.28,cy+ch*.18);ctx.lineTo(cx+cw*.28,cy-ch*.18);ctx.stroke()}}
   if(t.kind==="dust"){ctx.strokeStyle="rgba(8,10,24,.95)";ctx.lineWidth=Math.max(2,Math.min(cw,ch)*.22);ctx.lineCap="round";ctx.beginPath();ctx.moveTo(cx-Math.cos(dustAngle)*cw*.62,cy-Math.sin(dustAngle)*ch*.62);ctx.lineTo(cx+Math.cos(dustAngle)*cw*.62,cy+Math.sin(dustAngle)*ch*.62);ctx.stroke()}
 }
 ctx.restore()}
function generate(forceSeed){boot.style.display="block";boot.textContent="Solving WFC field…";seed=(forceSeed===undefined?newSeed():forceSeed)>>>0;var cols=clamp(Math.round(W/58),16,28),rows=clamp(Math.round(H/58),11,20),sol=solveWFC(cols,rows,seed);if(!sol){boot.textContent="Solver failed — tap New nebula";return}solution=sol;renderSolution(sol);stats.textContent="WFC "+cols+"×"+rows+" · "+sol.attempts+" attempt"+(sol.attempts===1?"":"s")+" · "+sol.ms+" ms · "+palettes[paletteIndex].name+" · seed "+seed;boot.style.display="none";}
function frame(ts){var dt=Math.min(.04,((ts-last)||16.7)/1000);last=ts;time+=dt;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);if(paint){var driftX=motion?Math.sin(time*.07)*7:0,driftY=motion?Math.cos(time*.055)*5:0;ctx.drawImage(paint,-7+driftX,-7+driftY,W+14,H+14)}for(var i=0;i<stars.length;i++){var s=stars[i],tw=motion?.66+.34*Math.sin(time*s.tw+s.phase):.8;ctx.fillStyle="rgba(235,245,255,"+(s.a*tw)+")";ctx.fillRect(s.x,s.y,s.r,s.r)}if(motion){var p=palettes[paletteIndex];ctx.globalCompositeOperation="screen";for(i=0;i<motes.length;i++){var m=motes[i],pulse=.45+.55*Math.sin(time*m.speed+m.phase);radial(ctx,m.x+Math.sin(time*.21+m.phase)*3,m.y+Math.cos(time*.18+m.phase)*2,m.r*7,m.color,.09+.10*pulse,1,0);ctx.fillStyle=rgba(p.hot,.45+.45*pulse);ctx.beginPath();ctx.arc(m.x,m.y,Math.max(.8,m.r*.55),0,6.28);ctx.fill()}ctx.globalCompositeOperation="source-over"}if(showStructure&&solution)drawStructure(solution);requestAnimationFrame(frame)}
document.getElementById("new").addEventListener("click",function(){generate(newSeed())});document.getElementById("structure").addEventListener("click",function(){showStructure=!showStructure;this.setAttribute("aria-pressed",showStructure?"true":"false");this.textContent=showStructure?"Hide WFC":"Show WFC"});document.getElementById("palette").addEventListener("click",function(){paletteIndex=(paletteIndex+1)%palettes.length;if(solution){renderSolution(solution);stats.textContent="WFC "+solution.cols+"×"+solution.rows+" · "+solution.attempts+" attempt"+(solution.attempts===1?"":"s")+" · "+solution.ms+" ms · "+palettes[paletteIndex].name+" · seed "+seed}});document.getElementById("motion").addEventListener("click",function(){motion=!motion;this.setAttribute("aria-pressed",motion?"true":"false");this.textContent=motion?"Motion on":"Motion off"});
resize();requestAnimationFrame(frame);
})();
</script>
