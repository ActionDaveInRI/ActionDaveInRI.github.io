<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070912">
<title>Nebula Weave — WFC Tech Demo</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070912;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{touch-action:manipulation}
  canvas{display:block;width:100%;height:100%;background:#070912}
  #ui{position:fixed;inset:0;pointer-events:none;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}
  .panel{pointer-events:auto;max-width:min(560px,calc(100vw - 24px));background:rgba(8,11,20,.72);border:1px solid rgba(255,255,255,.13);box-shadow:0 12px 40px rgba(0,0,0,.28);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #head{padding:13px 15px 12px}
  h1{font-size:17px;line-height:1.1;margin:0 0 5px;letter-spacing:.08em;text-transform:uppercase}
  #sub{font-size:12px;color:rgba(226,237,255,.72);line-height:1.4}
  #stats{margin-top:8px;font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:rgba(189,223,255,.78)}
  #bottom{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
  #controls{padding:9px;display:flex;gap:7px;flex-wrap:wrap}
  button{appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.075);color:#f5f9ff;border-radius:12px;min-height:42px;padding:0 14px;font-weight:700;font-size:12px;letter-spacing:.035em;touch-action:manipulation}
  button:active{transform:translateY(1px);background:rgba(255,255,255,.14)}
  button[aria-pressed="true"]{background:rgba(108,213,255,.18);border-color:rgba(122,221,255,.38)}
  #legend{padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:rgba(226,237,255,.74)}
  .key{display:flex;align-items:center;gap:5px;white-space:nowrap}.sw{width:9px;height:9px;border-radius:3px;box-shadow:0 0 10px currentColor}
  #boot{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;padding:11px 14px;border-radius:12px;background:#080b14e8;border:1px solid #ffffff22;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#dcecff}
  @media(max-width:620px){#head{padding:11px 12px}h1{font-size:15px}#sub{font-size:11px}#legend{display:none}button{min-height:44px;padding:0 12px}.panel{border-radius:14px}}
  @media(orientation:portrait) and (max-width:620px){#ui{padding-top:calc(9px + env(safe-area-inset-top));padding-bottom:calc(9px + env(safe-area-inset-bottom))}#head{max-width:calc(100vw - 18px)}#bottom{gap:6px}#controls{width:100%;justify-content:center}}
  @media(prefers-reduced-motion:reduce){#sub:after{content:" · reduced motion"}}
</style>
</head>
<body>
<canvas id="view" aria-label="Procedurally generated WFC nebula"></canvas>
<div id="boot">Solving WFC field…</div>
<div id="ui">
  <div id="head" class="panel">
    <h1>Nebula Weave</h1>
    <div id="sub">Wave Function Collapse organizes cores, filaments, haze and dust lanes. A procedural painter turns the solved structure into a soft nebula.</div>
    <div id="stats">initializing…</div>
  </div>
  <div id="bottom">
    <div id="controls" class="panel">
      <button id="new">New nebula</button>
      <button id="structure" aria-pressed="false">Show WFC</button>
      <button id="palette">Palette</button>
      <button id="motion" aria-pressed="true">Motion on</button>
    </div>
    <div id="legend" class="panel">
      <span class="key"><i class="sw" style="color:#6fe6ff;background:#6fe6ff"></i>filament</span>
      <span class="key"><i class="sw" style="color:#dca2ff;background:#dca2ff"></i>dense/core</span>
      <span class="key"><i class="sw" style="color:#26304e;background:#26304e"></i>dust</span>
      <span class="key"><i class="sw" style="color:#83afc9;background:#83afc9"></i>haze</span>
    </div>
  </div>
</div>
<script>
(function(){
 var boot=document.getElementById("boot");
 var files=["part1.js","part2.js","part3.js","part4.js","part5.js","part6.js"];
 Promise.all(files.map(function(url){return fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(url+" "+r.status);return r.text()})})).then(function(parts){new Function(parts.join(""))()}).catch(function(err){boot.style.display="block";boot.textContent="Load error: "+err.message});
})();
</script>
</body>
</html>
