<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171d28"><title>Wayfarer · Pixel Study</title><meta name="description" content="Explore Cinder Quay: a procedural pixel-art spaceport with articulated characters, equipment and environmental interactions."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23171d28' d='M0 0h32v32H0z'/%3E%3Cpath fill='%2378bdb4' d='M4 20h5v-7h5V6h4v7h5v7h5v5H4z'/%3E%3Cpath fill='%23f4bf76' d='M13 24h6v5h-6z'/%3E%3C/svg%3E"><link rel="stylesheet" href="./src/style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><main id="game" aria-label="Cinder Quay interactive pixel-art study"><canvas id="scene" aria-label="Spaceport. Use WASD or tap the ground to walk." tabindex="0"></canvas>
<header><div class="identity"><span class="eyebrow">WAYFARER <i>/</i> PIXEL STUDY 03</span><h1>Cinder Quay</h1><span class="sub">The traveler · Cinder Quay</span></div><div class="top-actions"><button id="tour" aria-pressed="false">Watch a tour</button><button id="settings-toggle" aria-expanded="false" aria-controls="settings">View <span aria-hidden="true">☷</span></button></div></header>
<section id="settings" hidden aria-label="View settings"><div class="setting"><label for="framing">Framing</label><select id="framing"><option value="traveler">Traveler study</option><option value="courtyard">Whole courtyard</option></select></div><div class="setting"><label for="pixels">Detail</label><select id="pixels"><option value="180">Coarse · 180</option><option value="216" selected>Balanced · 216</option><option value="270">Fine · 270</option><option value="360">Extra fine · 360</option><option value="smooth">Smooth 3D</option></select></div><div class="setting"><label for="zoom">Zoom</label><input id="zoom" type="range" min="0.7" max="1.8" step="0.01" value="1"></div><div class="setting"><label for="follow">Follow traveler</label><input id="follow" type="checkbox" checked></div><div class="setting"><span>Camera</span><div class="joined"><button id="turn-left" aria-label="Rotate camera left">↶</button><button id="turn-right" aria-label="Rotate camera right">↷</button><button id="home-view">Reset</button></div></div><button id="sound" aria-pressed="false">Sound off</button><button id="save-frame">Save PNG frame</button><p><output id="render-info"></output></p></section>
<div id="loading">Arriving at Cinder Quay…</div><div id="fatal" hidden role="alert"></div>
<div id="marker" hidden></div><aside id="readout"><span class="label">TRAVELER</span><p id="status" aria-live="polite">A quiet berth. Tap the ground to explore.</p><span id="activity">Standing · weapon holstered</span></aside>
<div id="joystick" aria-label="Touch movement"><div id="stick"></div></div>
<footer><div class="hints"><span><kbd>W A S D</kbd> move</span><span><kbd>Shift</kbd> run</span><span><kbd>E</kbd> interact</span><span><kbd>Space</kbd> draw</span><span>Tap ground to walk</span></div><div class="actions"><button data-action="bench"><span class="key">1</span> Sit</button><button data-action="crate"><span class="key">2</span> Lean</button><button data-action="ship"><span class="key">3</span> Board</button><button id="weapon"><span class="key">␣</span> Draw</button></div></footer>
</main><script type="module" src="./src/main.js"></script></body></html>
